name: heavenbrowser
description: "Heaven Browser - A fast, minimal Android web browser."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.7.0
  shared_preferences: ^2.5.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.0
  http: ^1.2.2
  openvpn_flutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/heaven_logo.png
