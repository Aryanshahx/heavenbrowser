name: Build Heaven Browser Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Analyze, Test & Build Release APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Dart static analysis
        run: dart analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Configure Play Store Upload Signing Key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 --decode > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_PASSWORD" \
              "$ANDROID_KEY_ALIAS" > android/key.properties
            echo "Play Store release signing enabled (upload-keystore.jks)."
          else
            echo "Play Store signing secrets not set yet; building with fallback signing."
          fi

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        if: github.event_name != 'pull_request'
        run: flutter build appbundle --release

      - name: Stage named Release APK and AAB artifacts
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk dist-artifacts/HeavenBrowser-v0.0.1-release.apk
          cp build/app/outputs/bundle/release/app-release.aab dist-artifacts/HeavenBrowser-v0.0.1-release.aab
          ls -lh dist-artifacts/

      - name: Upload Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: dist-artifacts/HeavenBrowser-v0.0.1-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload Release AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: dist-artifacts/HeavenBrowser-v0.0.1-release.aab
          archive: false
          if-no-files-found: error

      - name: Clean up temporary signing files
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
